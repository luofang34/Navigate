[package]
name = "navigate-guidance"
description = "Surface, orbital, entry, and descent guidance from a solution plus a target to setpoints"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = [
    "nalgebra/std",
    "navigate-astrodynamics/std",
    "navigate-contract/std",
    "navigate-geodesy/std",
    "navigate-route/std",
    "navigate-trajectory/std",
]
libm = [
    "dep:libm",
    "nalgebra/libm",
    "navigate-astrodynamics/libm",
    "navigate-contract/libm",
    "navigate-geodesy/libm",
    "navigate-route/libm",
    "navigate-trajectory/libm",
]

[dependencies]
nalgebra = { workspace = true }
navigate-astrodynamics = { workspace = true }
navigate-contract = { workspace = true, default-features = false }
navigate-geodesy = { workspace = true, default-features = false }
navigate-route = { workspace = true }
navigate-trajectory = { workspace = true }
libm = { version = "0.2.16", optional = true }
thiserror = { workspace = true }

[lints]
workspace = true
