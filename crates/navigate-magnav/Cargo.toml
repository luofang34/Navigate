[package]
name = "navigate-magnav"
description = "Magnetic anomaly navigation: Tolles-Lawson calibration, borrowed grid maps, and Cramér-Rao bounds"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Float functions from the standard library.
std = [
    "nalgebra/std",
    "navigate-contract/std",
    "navigate-geodesy/std",
    "navigate-astrodynamics/std",
    "navigate-fusion/std",
]
# Float functions from libm, for targets without the standard library.
libm = [
    "dep:libm",
    "nalgebra/libm",
    "navigate-contract/libm",
    "navigate-geodesy/libm",
    "navigate-astrodynamics/libm",
    "navigate-fusion/libm",
]

[dependencies]
libm = { version = "0.2.16", optional = true }
nalgebra = { workspace = true }
navigate-astrodynamics = { workspace = true }
navigate-contract = { workspace = true }
navigate-fusion = { workspace = true }
navigate-geodesy = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
