[package]
name = "navigate-camera"
description = "One imaging sensor model: pinhole intrinsics, distortion, optical pose, mount, band, and borrowed pixels"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Float functions from the standard library.
std = ["nalgebra/std", "navigate-contract/std", "navigate-geodesy/std"]
# Float functions from libm, for targets without the standard library.
libm = ["nalgebra/libm", "navigate-contract/libm", "navigate-geodesy/libm"]

[dependencies]
nalgebra = { workspace = true }
navigate-contract = { workspace = true }
navigate-geodesy = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
