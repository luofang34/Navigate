[package]
name = "navigate-visual"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["fusion"]
serde = ["dep:serde"]
# Conversion of an estimate into a fusion position fix or a visual pose (ADR-0007, ADR-0020).
fusion = ["dep:navigate-fusion"]
reconstruction = ["dep:kornia-3d", "dep:kornia-algebra", "dep:lambda-twist", "dep:cv-core", "dep:getrandom"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
navigate-contract.workspace = true
navigate-fusion = { workspace = true, features = ["std"], optional = true }
navigate-geodesy = { workspace = true, features = ["std"] }
sha2 = "0.11"
nalgebra = { workspace = true, features = ["std"] }
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", optional = true }
pollster = { version = "1.0", optional = true }

kornia-3d = { version = "0.2.0", optional = true }
kornia-algebra = { version = "0.2.0", optional = true }
lambda-twist = { version = "0.7", optional = true }
cv-core = { version = "0.15", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[[test]]
name = "polar_visual_pose"
required-features = ["fusion"]

[lints]
workspace = true
