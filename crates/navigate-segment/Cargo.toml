[package]
name = "navigate-segment"
description = "Pure-Rust SegFormer semantic segmentation, mask policies, and 4-class fine-tuning on burn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["flex"]
flex = ["burn/flex"]
optim = ["burn/optim", "dep:rand", "dep:zip"]
wgpu = ["burn/wgpu"]
webgpu = ["burn/webgpu"]
metal = ["burn/metal"]
vulkan = ["burn/vulkan"]
cuda = ["burn/cuda"]

[dependencies]
navigate-visual = { path = "../navigate-visual" }
burn = { version = "0.22.1", default-features = false, features = ["std"] }
safetensors = { version = "0.8.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.1.0", default-features = false, features = ["deflate"], optional = true }
rand = { version = "0.10", optional = true }
image = { workspace = true, features = ["png", "jpeg"] }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "flex"] }
tempfile = "3"

[lints]
workspace = true
