[package]
name = "navigate-locate"
description = "Camera pose of one photo or flight corridor from map imagery and terrain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Native tile source over HTTP with a disk cache, for tools and tests.
http = ["dep:ureq"]
# JSON encoding of worker messages and dynamics profiles across boundaries.
serde = ["dep:serde", "navigate-visual/serde"]

[dependencies]
navigate-contract.workspace = true
navigate-fusion.workspace = true
navigate-geodesy.workspace = true
navigate-visual = { path = "../navigate-visual" }
navigate-visual-session = { path = "../navigate-visual-session" }
navigate-visual-fusion = { path = "../navigate-visual-fusion" }
navigate-place = { path = "../navigate-place" }
navigate-visual-render = { path = "../navigate-visual-render" }
navigate-match = { path = "../navigate-match", default-features = false }
image = { workspace = true, features = ["jpeg", "png"] }
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2 = { version = "0.11", default-features = false }
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
web-time = "1"
kamadak-exif = "0.6.1"
serde = { version = "1", features = ["derive"], optional = true }
ureq = { version = "3.5.0", optional = true }

[dev-dependencies]
pollster = "0.3"
navigate-match = { path = "../navigate-match", features = ["wgpu"] }
burn = { version = "0.22.1", default-features = false, features = ["std", "wgpu"] }
serde_json = "1"
tracing-subscriber.workspace = true

[lints]
workspace = true

[[example]]
name = "photo"
required-features = ["http"]

[[example]]
name = "search"
required-features = ["http"]

[[test]]
name = "oryol"
required-features = ["http"]
