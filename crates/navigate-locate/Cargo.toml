[package]
name = "navigate-locate"
description = "Camera pose of one photo or flight corridor from map imagery, terrain, and a place index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Native tile source over HTTP with a disk cache, for tools and tests.
http = ["dep:ureq"]
# JSON encoding of worker messages and dynamics profiles across boundaries.
serde = ["navigate-visual/serde"]

[dependencies]
navigate-contract.workspace = true
navigate-fusion = { workspace = true, features = ["std"] }
navigate-geodesy = { workspace = true, features = ["std"] }
navigate-visual = { workspace = true, features = ["fusion"] }
navigate-visual-render.workspace = true
navigate-match.workspace = true
image = { workspace = true, features = ["jpeg", "png"] }
nalgebra = { workspace = true, features = ["std"] }
thiserror.workspace = true
tracing.workspace = true
sha2 = { version = "0.11", default-features = false }
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
web-time = "1"
kamadak-exif = "0.6.1"
half = { version = "2.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0"

[dev-dependencies]
pollster = "1.0"
navigate-match = { workspace = true, features = ["flex", "wgpu"] }
burn = { version = "0.22.1", default-features = false, features = ["std", "wgpu"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

[[example]]
name = "photo"
required-features = ["http"]

[[example]]
name = "search"
required-features = ["http"]

[[test]]
name = "oryol"
required-features = ["http"]
