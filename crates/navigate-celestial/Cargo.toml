[package]
name = "navigate-celestial"
description = "Observer states and celestial reception geometry without a map or host clock"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["long-range"]
anise = ["dep:anise"]
# Sun and Moon from -2000 to 3000 with VSOP87B and ELP2000-82B fitted to DE431,
# for historical and ancient use. Without it, smaller series cover 1800 to 2200.
long-range = []

[dependencies]
flamsteed.workspace = true
anise = { version = "0.10.6", default-features = false, optional = true }
hifitime = "4.3.1"
nalgebra.workspace = true
thiserror.workspace = true

[dev-dependencies]
eclipse-canon.workspace = true
erfa = "0.2.1"
navigate-contract.workspace = true
navigate-geodesy.workspace = true
serde_json = "1"

[[example]]
name = "reference_table"
required-features = ["anise"]

[[example]]
name = "earth_fixed_reference_table"
required-features = ["anise"]

[[example]]
name = "long_range_fit"
required-features = ["anise"]

[lints]
workspace = true
