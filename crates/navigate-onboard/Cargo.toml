[package]
name = "navigate-onboard"
description = "The onboard boundary: navigator and flight-director traits, a declared sensor suite, and the reference composition"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The entry that sets the state of the reference navigator from the true
# state of a simulation. An evaluation enables it; a flight build does not.
evaluation = []
# The terrain-camera means of the reference navigator. It links the visual
# matcher and the reference renderer, and with them `wgpu`. The feature
# adds code only: a navigator without a declared terrain camera gives the
# same values with and without it.
terrain-camera = [
    "dep:navigate-visual",
    "dep:navigate-visual-render",
    "dep:image",
    "dep:pollster",
]

[dependencies]
nalgebra = { workspace = true, features = ["std"] }
navigate-camera = { workspace = true, features = ["std"] }
navigate-celestial.workspace = true
navigate-contract = { workspace = true, features = ["std"] }
navigate-data = { workspace = true, features = ["std"] }
navigate-fusion = { workspace = true, features = ["std"] }
navigate-geodesy = { workspace = true, features = ["std"] }
navigate-guidance = { workspace = true, features = ["std"] }
navigate-route = { workspace = true, features = ["std"] }
navigate-startrack.workspace = true
navigate-visual = { workspace = true, features = ["fusion"], optional = true }
navigate-visual-render = { workspace = true, optional = true }
image = { workspace = true, optional = true }
pollster = { version = "1.0", optional = true }
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true

[[test]]
name = "terrain_camera"
required-features = ["terrain-camera"]

[lints]
workspace = true
