version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
repository = "https://github.com/luofang34/Navigate"
readme = "README.md"
keywords = ["astronomy", "stars", "catalogue", "astrometry", "wasm"]
