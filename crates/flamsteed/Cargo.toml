[package]
name = "flamsteed"
description = "Bright stars and their motion in space, from public-domain catalogue data, with no I/O"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luofang34/Navigate"
readme = "README.md"
keywords = ["astronomy", "stars", "catalogue", "astrometry", "wasm"]
categories = ["science"]
publish = true
include = [
    "build.rs",
    "src/**/*.rs",
    "examples/*.rs",
    "data/bsc5.bin",
    "data/orbits.bin",
    "fixtures/orb6-ephemerides.txt",
    "fixtures/star-space-motion.txt",
    "LICENSE",
    "README.md",
]

[features]
default = ["std", "all-stars"]
# Float functions from the standard library.
std = []
# Embed the stars to visual magnitude 5.0. Without a magnitude feature the
# crate embeds the stars to magnitude 4.0.
magnitude-5 = []
# Embed every star of the catalogue.
all-stars = ["magnitude-5"]
# Float functions from libm, for targets without the standard library.
libm = ["dep:libm"]
# Square roots from core on a nightly compiler (`core_float_math`), which use
# the hardware instruction where the target has one, for example vsqrt.f32 on
# the Cortex-M33. It needs a nightly toolchain.
nightly = []

[dependencies]
libm = { version = "0.2.16", optional = true }

[dev-dependencies]
thiserror = { version = "2.0.21", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
await_holding_lock = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
