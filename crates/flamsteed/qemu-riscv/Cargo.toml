# Runs flamsteed without the standard library on a 32-bit RISC-V core with no
# FPU (RV32IMAC, as in the RP2350 Hazard3 cores), in QEMU. It is not part of
# the workspace and is not published; scripts/check-flamsteed-qemu.sh runs it.
[package]
name = "flamsteed-qemu-riscv"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
flamsteed = { path = "..", default-features = false, features = ["libm", "all-stars"] }
riscv-rt = "0.16"
riscv = { version = "0.15", features = ["critical-section-single-hart"] }
semihosting = { version = "0.1", features = ["stdio"] }
panic-halt = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]

# The workspace lint table, repeated for this package outside the workspace.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
await_holding_lock = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
