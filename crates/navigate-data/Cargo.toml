[package]
name = "navigate-data"
description = "Navigation data contract: content-addressed mission packages, canonical manifests, digests, verification, read and fetch ports"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Float functions from the standard library, and the directory store.
std = ["navigate-contract/std", "navigate-geodesy/std", "serde/std", "serde_json/std", "thiserror/std"]
# Float functions from libm, for targets without the standard library.
libm = ["navigate-contract/libm", "navigate-geodesy/libm"]

[dependencies]
navigate-contract = { workspace = true }
navigate-geodesy = { workspace = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
pollster = "1.0"
tempfile = "3"

[lints]
workspace = true
