[workspace]
resolver = "3"
members = [
    "crates/navigate-contract",
    "crates/navigate-geodesy",
    "crates/navigate-fusion",
    "crates/navigate-fpl",
    "crates/navigate-guidance",
    "crates/navigate-egpws",
    "tools/navrun",
    "crates/navigate-visual",
]
exclude = ["tools/visual-bench"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
navigate-contract = { path = "crates/navigate-contract" }
navigate-geodesy = { path = "crates/navigate-geodesy" }
navigate-fusion = { path = "crates/navigate-fusion" }
navigate-fpl = { path = "crates/navigate-fpl" }
navigate-guidance = { path = "crates/navigate-guidance" }
navigate-egpws = { path = "crates/navigate-egpws" }
thiserror = { version = "2.0.18", default-features = false }
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
image = { version = "0.25.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
