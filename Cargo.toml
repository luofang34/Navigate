[workspace]
resolver = "3"
members = [
    "crates/eclipse-canon",
    "crates/flamsteed",
    "crates/navigate-celestial",
    "crates/navigate-contract",
    "crates/navigate-geodesy",
    "crates/navigate-astrodynamics",
    "crates/navigate-fusion",
    "crates/navigate-magnav",
    "crates/navigate-route",
    "crates/navigate-trajectory",
    "crates/navigate-guidance",
    "crates/navigate-terrain-safety",
    "tools/navrun",
    "crates/navigate-recording",
    "tools/visual-model",
    "crates/navigate-visual",
    "crates/navigate-match",
    "crates/navigate-match-kernels",
    "crates/navigate-locate",
    "crates/navigate-locate-web",
    "crates/navigate-visual-render",
    "tools/visual-pipeline",
    "tests/e2e-corridor",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
eclipse-canon = { path = "crates/eclipse-canon" }
flamsteed = { path = "crates/flamsteed", version = "0.1.0" }
navigate-contract = { path = "crates/navigate-contract", default-features = false }
navigate-geodesy = { path = "crates/navigate-geodesy", default-features = false }
navigate-astrodynamics = { path = "crates/navigate-astrodynamics", default-features = false }
navigate-fusion = { path = "crates/navigate-fusion", default-features = false }
navigate-magnav = { path = "crates/navigate-magnav", default-features = false }
navigate-route = { path = "crates/navigate-route", default-features = false }
navigate-trajectory = { path = "crates/navigate-trajectory", default-features = false }
navigate-guidance = { path = "crates/navigate-guidance", default-features = false }
navigate-terrain-safety = { path = "crates/navigate-terrain-safety", default-features = false }
navigate-celestial = { path = "crates/navigate-celestial" }
navigate-recording = { path = "crates/navigate-recording" }
navigate-visual = { path = "crates/navigate-visual", default-features = false }
navigate-visual-render = { path = "crates/navigate-visual-render" }
navigate-match = { path = "crates/navigate-match", default-features = false }
navigate-match-kernels = { path = "crates/navigate-match-kernels" }
navigate-locate = { path = "crates/navigate-locate" }
navigate-locate-web = { path = "crates/navigate-locate-web" }
navigate-visual-pipeline = { path = "tools/visual-pipeline" }
navrun = { path = "tools/navrun" }
thiserror = { version = "2.0.18", default-features = false }
nalgebra = { version = "0.34.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
image = { version = "0.25.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
await_holding_lock = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
