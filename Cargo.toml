[workspace]
resolver = "3"
members = [
    "crates/navigate-contract",
    "crates/navigate-geodesy",
    "crates/navigate-fusion",
    "crates/navigate-fpl",
    "crates/navigate-guidance",
    "crates/navigate-egpws",
    "tools/navrun",
    "crates/navigate-visual",
    "crates/navigate-visual-fusion",
    "crates/navigate-data",
    "crates/navigate-data-fs",
    "crates/navigate-imagery",
]
exclude = [
    "tools/imagery-provider",
    "tools/visual-bench",
    "tools/visual-inference",
    "tools/visual-service",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
navigate-contract = { path = "crates/navigate-contract" }
navigate-geodesy = { path = "crates/navigate-geodesy" }
navigate-fusion = { path = "crates/navigate-fusion" }
navigate-fpl = { path = "crates/navigate-fpl" }
navigate-guidance = { path = "crates/navigate-guidance" }
navigate-egpws = { path = "crates/navigate-egpws" }
thiserror = { version = "2.0.18", default-features = false }
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
image = { version = "0.25.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
await_holding_lock = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
