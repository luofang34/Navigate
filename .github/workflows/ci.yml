name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # The visual tools build against the sibling MapLibre fork at the pinned commit.
      - name: Check out the pinned MapLibre fork
        run: |
          git clone --filter=blob:none https://github.com/luofang34/maplibre-rs-experimental.git ../maplibre-rs-experimental
          git -C ../maplibre-rs-experimental checkout --detach "$(tr -d '[:space:]' < tools/visual-bench/MAPLIBRE_REVISION)"

      # The imagery provider and the visual service link the system GDAL library.
      # The MapLibre fork's build script compiles protobuf schemas with protoc.
      - name: Install GDAL and protoc
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev protobuf-compiler

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check action runtimes
        run: |
          node --test scripts/check-actions.test.mjs
          node scripts/check-actions.mjs

      - name: Full gate
        run: ./ci.sh
