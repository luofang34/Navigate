# Publish a workspace crate to crates.io and add its package to a GitHub
# release when a tag `<crate>-vX.Y.Z` is pushed. The tag must name a
# publishable workspace crate at its manifest version, on a commit of main
# that passed CI.
#
# A crate that crates.io already has is published with a short-lived token
# from crates.io trusted publishing, which accepts this workflow file in the
# `release` environment. crates.io does not let trusted publishing create a
# crate, so only the first version of a crate uses the CARGO_REGISTRY_TOKEN
# secret.
name: release

on:
  push:
    tags: ["*-v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Read the CI runs of the tagged commit.
      actions: read
      # Create the GitHub release.
      contents: write
      # Exchange the GitHub OIDC token for a crates.io token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Check the tag
        id: tag
        run: |
          crate=${GITHUB_REF_NAME%-v*}
          version=${GITHUB_REF_NAME#"$crate-v"}
          manifest=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -c --arg name "$crate" '.packages[] | select(.name == $name)')
          if [ -z "$manifest" ]; then
            echo "::error::$GITHUB_REF_NAME names $crate, which is not a workspace crate"
            exit 1
          fi
          # cargo metadata gives publish as null when every registry may take the crate.
          if [ "$(jq -c .publish <<<"$manifest")" != null ]; then
            echo "::error::$crate does not allow publishing"
            exit 1
          fi
          if [ "$(jq -r .version <<<"$manifest")" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match $crate $(jq -r .version <<<"$manifest")"
            exit 1
          fi
          commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $commit, which is not on main"
            exit 1
          fi
          {
            echo "crate=$crate"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          run=$(gh run list --workflow ci.yml --branch main --event push --commit "$COMMIT" \
            --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error::CI did not run on $COMMIT as a push to main"
            exit 1
          fi
          if ! gh run watch "$run" --exit-status --interval 60 > /dev/null; then
            echo "::error::CI run $run failed on $COMMIT"
            exit 1
          fi
          # Runs for a tag, this release among them, do not count.
          failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$COMMIT" \
            -q '.workflow_runs[] | select(.head_branch == "main" and .conclusion == "failure") | .name')
          if [ -n "$failed" ]; then
            echo "::error::These workflows failed on $COMMIT: $failed"
            exit 1
          fi

      - name: Look up the crate on crates.io
        id: registry
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "release (github.com/$GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/$CRATE")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered HTTP $status for $CRATE"; exit 1 ;;
          esac

      - name: Get a crates.io token from trusted publishing
        id: auth
        if: steps.registry.outputs.exists == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ steps.registry.outputs.exists == 'true' && steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::$CRATE is not on crates.io yet, and the first version needs the CARGO_REGISTRY_TOKEN secret"
            exit 1
          fi
          cargo publish -p "$CRATE" --locked

      - name: Add the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ steps.tag.outputs.crate }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Attach the file that crates.io serves, after a check against the
          # checksum that crates.io records for the version. cargo publish
          # does not keep its package at a fixed path.
          file="$CRATE-$VERSION.crate"
          agent="release (github.com/$GITHUB_REPOSITORY)"
          want=$(curl -sSf -A "$agent" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION" | jq -r .version.checksum)
          curl -sSfL -A "$agent" -o "$file" \
            "https://static.crates.io/crates/$CRATE/$file"
          echo "$want  $file" | sha256sum --check
          gh release create "$GITHUB_REF_NAME" "$file" \
            --verify-tag \
            --title "$CRATE $VERSION" \
            --notes "$CRATE $VERSION on crates.io: https://crates.io/crates/$CRATE/$VERSION. The .crate file is the published package."
