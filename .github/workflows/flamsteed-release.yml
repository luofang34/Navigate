# Publish flamsteed to crates.io and add its package to a GitHub release
# when a tag `flamsteed-vX.Y.Z` is pushed. The tag must match the crate
# version. The CARGO_REGISTRY_TOKEN secret is the credential for the first
# release; replace it with crates.io trusted publishing after that release.
name: flamsteed release

on:
  push:
    tags: ["flamsteed-v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Check that the tag matches the crate version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "flamsteed") | .version')
          if [ "$GITHUB_REF_NAME" != "flamsteed-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match flamsteed $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test the crate
        run: |
          cargo test -p flamsteed --locked
          cargo clippy -p flamsteed --all-targets --locked -- -D warnings
          cargo clippy -p flamsteed --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p flamsteed --locked

      - name: Add the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/package/flamsteed-$VERSION.crate" \
            --title "flamsteed $VERSION" \
            --notes "flamsteed $VERSION on crates.io: https://crates.io/crates/flamsteed/$VERSION. The .crate file is the published package."
