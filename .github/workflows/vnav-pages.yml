name: VNAV Pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/visual-bench/**'
      - 'crates/navigate-visual/**'
      - 'crates/navigate-imagery/**'
      - '.github/workflows/vnav-pages.yml'
  push:
    branches: [main]
    paths:
      - 'tools/visual-bench/**'
      - 'crates/navigate-visual/**'
      - 'crates/navigate-imagery/**'
      - '.github/workflows/vnav-pages.yml'

permissions:
  contents: read

concurrency:
  group: vnav-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          path: Navigate
      - name: Read the renderer revision
        id: renderer
        working-directory: Navigate
        shell: bash
        run: |
          revision=$(tr -d '[:space:]' < tools/visual-bench/MAPLIBRE_REVISION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: luofang34/maplibre-rs-experimental
          ref: ${{ steps.renderer.outputs.revision }}
          path: maplibre-rs-experimental
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: Navigate/tools/visual-bench/wasm-preview
      - name: Check browser behavior
        working-directory: Navigate
        run: |
          for test in tools/visual-bench/tests/test_*.mjs; do node "$test"; done
      - name: Install renderer build dependency
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Build Rust WASM and public model assets
        working-directory: Navigate
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          node tools/visual-bench/build_web.mjs
          node tools/visual-bench/prepare_browser_models.mjs
      - name: Read the fixed public reference package
        run: |
          curl --fail --location --retry 3 https://github.com/luofang34/Navigate/releases/download/vnav-demo-data-20260922/naip-demo-data.tar.gz --output reference-data.tar.gz
          echo '7a89acaea6a84b92a2b59e54882b82446cc71d4c75fc1ae9d623c7748d0272d8  reference-data.tar.gz' | sha256sum --check
          mkdir reference-data
          tar -xzf reference-data.tar.gz -C reference-data
          node Navigate/tools/visual-bench/export_web.mjs reference-data site naip-2864a5ec8e4abb24
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # Node.js 24 upload dependency
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
