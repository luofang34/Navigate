# Dependabot updates the pinned workflow actions and the Cargo dependencies
# every week. Each action pin is a full commit SHA with its release tag in a
# comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directories:
      - /
      - /crates/flamsteed/qemu-arm
      - /crates/flamsteed/qemu-riscv
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
