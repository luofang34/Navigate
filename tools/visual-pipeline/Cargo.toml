[package]
name = "navigate-visual-pipeline"
description = "Pure-Rust photo and video preprocessing, pose search, verification, segmentation, and Sokoly debrief export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "navigate-visual-pipeline"
path = "src/main.rs"

[features]
default = ["flex"]
flex = ["navigate-match/flex", "navigate-visual-flight/flex"]
wgpu = ["navigate-match/wgpu", "navigate-visual-flight/wgpu"]
metal = ["navigate-match/metal", "navigate-visual-flight/metal"]
cuda = ["navigate-match/cuda", "navigate-visual-flight/cuda"]

[dependencies]
navigate-contract.workspace = true
navigate-geodesy = { workspace = true, features = ["std"] }
navigate-visual = { workspace = true, features = ["serde", "fusion"] }
navigate-visual-render.workspace = true
navigate-locate = { workspace = true, features = ["serde"] }
navigate-visual-flight.workspace = true
navigate-fusion = { workspace = true, features = ["std"] }
navigate-recording.workspace = true
navigate-match = { workspace = true, features = ["ort", "optim"] }
burn = { version = "0.22.1", default-features = false, features = ["std", "flex"] }
clap = "4"
kamadak-exif = "0.6.1"
nalgebra = { workspace = true, features = ["std"] }
pollster = "1.0"
image = { workspace = true, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = { workspace = true, features = ["std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
