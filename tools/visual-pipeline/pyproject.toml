[project]
name = "navigate-visual-pipeline"
version = "0.1.0"
description = "Visual positioning and recording preparation for Navigate"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "scipy",
]

[project.optional-dependencies]
photo-matching = [
    "onnxruntime",
    "torch",
    "transformers",
]
photo-roma = ["romatch==0.1.2"]

[tool.uv]
package = false
