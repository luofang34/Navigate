[package]
name = "dense-correlation-probe"
version = "0.1.0"
publish = false
description = "Fixed-feature masked correlation and search experiments"
edition = "2024"
[workspace]
[dependencies]
rustfft = "6.4.1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "forbid"
disallowed_macros = "forbid"
