[package]
name = "navigate-recording-worker"
description = "Resident camera matching and Navigate recording worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
navigate-recording = { path = "../../crates/navigate-recording" }
navigate-visual = { path = "../../crates/navigate-visual" }
navigate-visual-onnx = { package = "visual-inference-probe", path = "../visual-inference" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { workspace = true, features = ["png"] }

[lints]
workspace = true
