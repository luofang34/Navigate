<!doctype html><meta charset="utf-8"><title>Review refined scene cameras</title><style>body{background:#090e15;color:#dce7f7;font:18px system-ui;margin:32px}pre{white-space:pre-wrap}button,a{font:inherit;color:inherit}</style><h1>Review refined scene cameras</h1><p>This adds a separate conditional camera path. It retains the existing map transform as an unverified alignment proposal.</p><button>Add verified browser camera fits</button><pre>Ready</pre><a id="open" hidden>Open camera-path review</a><script type="module">
import * as storage from './storage.js';
import init,{registered_scene_cameras} from './wasm/navigate_visual_preview.js';
const output=document.querySelector('pre'),sink='http://127.0.0.1:61678/';
document.querySelector('button').onclick=async e=>{e.target.disabled=true;try{
 const receipt=await(await fetch(sink+'browser-scene-resection.json')).json();if(receipt.stage!=='browser_scene_resection'||receipt.geographic_acceptance!==false||receipt.frames.length!==742||receipt.supported!==receipt.frames.length)throw Error('Incomplete browser fit receipt');
 const mission=await storage.get('missions','aee48b20e6714aefb3436720ec149a93');if(!mission)throw Error('Saved source review absent');
 const source=mission.view.frames[0].candidate_hypotheses.find(h=>h.scene_supported&&JSON.stringify(h.scene_path_sha256)===JSON.stringify(receipt.source_scene_path_sha256));if(!source)throw Error('Coordinate lineage has no matching map proposal');
 const record=source.scene_registration.record,bytes=await storage.read(record.uri,0,record.size);if(await storage.sha256(bytes)!==record.sha256)throw Error('Registration checksum changed');
 const registration=JSON.parse(new TextDecoder().decode(bytes)),candidate=registration.candidates[source.scene_registration.candidate_index];if(!candidate||registration.geographic_acceptance!==false||registration.map_manifest_sha256!==mission.pack_id)throw Error('Invalid map registration proposal');
 const byId=new Map(mission.view.frames.map(f=>[f.observation_sha256,f]));for(const r of receipt.frames){const f=byId.get(r.observation_sha256);if(!f||f.capture_time_ns!==r.capture_time_ns||f.sequence!==r.sequence||r.scene_sha256!==receipt.scene_sha256||r.geographic_acceptance!==false)throw Error('Source observation changed')}
 const backupKey='scene-review-before-'+receipt.scene_sha256;if(!await storage.get('state',backupKey))await storage.put('state',backupKey,structuredClone(mission));
 await init();const cameras=receipt.frames.map(f=>({observation_sha256:f.observation_sha256,position_scene_units:f.fit.position_scene_units,eye_to_scene_xyzw:f.fit.eye_to_scene_xyzw,fixed:false})),mapped=[];
 for(let i=0;i<cameras.length;i+=128)mapped.push(...JSON.parse(registered_scene_cameras(JSON.stringify({cameras:cameras.slice(i,i+128),points:[]}),JSON.stringify(candidate))));
 const track_id=JSON.stringify(['joint_scene_camera_review',receipt.scene_sha256,record.sha256,source.scene_registration.candidate_index]);
 for(const [i,camera] of mapped.entries()){
  const frame=byId.get(camera.observation_sha256);if(frame.candidate_hypotheses.some(h=>h.track_id===track_id))continue;
  const used=new Set(frame.candidate_hypotheses.map(h=>h.candidate_id));let id=0;while(used.has(id))id=(id+1)>>>0;
  frame.candidate_hypotheses.unshift({...camera,candidate_id:id,accepted:false,scene_supported:true,geographic_acceptance:false,track_id,map_manifest_sha256:mission.pack_id,scene_path_sha256:[receipt.scene_sha256],
   source_scene_path_sha256:receipt.source_scene_path_sha256,scene_registration:{record,candidate_index:source.scene_registration.candidate_index,stage:'inherited_registration_proposal'},
   scene_resection:{input_sha256:receipt.input_sha256,scene_sha256:receipt.scene_sha256,inlier_feature_ids:receipt.frames[i].fit.inlier_feature_ids,reprojection_rms_px:receipt.frames[i].fit.reprojection_rms_px},
   evidence_correlation:'unknown; refined cameras, scene and original map transform share evidence; no confidence accumulation',geographic_accuracy:'not_independently_measured'});
  frame.accepted=false;frame.decision='scene_registration';
 }
 mission.view.joint_scene_review={scene_sha256:receipt.scene_sha256,source_scene_path_sha256:receipt.source_scene_path_sha256,geographic_acceptance:false,map_alignment:'inherited proposal; not revalidated against refined geometry',backup_state_key:backupKey};await storage.put('missions',mission.id,mission);
 const report={stage:'conditional_refined_path_preview',mission_id:mission.id,frames:mapped.length,scene_sha256:receipt.scene_sha256,geographic_acceptance:false,original_alternatives_retained:true,map_alignment:'inherited proposal; not revalidated against refined geometry'};
 await fetch(sink+'result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});output.textContent=JSON.stringify(report,null,2);const link=document.querySelector('#open');link.href='./?mission='+mission.id+'&time=140';link.hidden=false;document.title='Ready refined camera review';
}catch(error){output.textContent=String(error)+'\n'+error.stack;document.title='FAIL refined camera review'}finally{e.target.disabled=false}};
</script>
