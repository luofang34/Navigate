<!doctype html><meta charset="utf-8"><title>Targeted recovery check</title><style>body{background:#090e15;color:#dce7f7;font:16px system-ui;padding:24px}pre{white-space:pre-wrap}</style><h1>Targeted recovery check</h1><pre>Starting</pre><script type="module">
const worker=new Worker('./qa-targeted-recovery-worker.js',{type:'module'}),output=document.querySelector('pre');let pending=Promise.resolve();
worker.onmessage=({data})=>{if(data.progress){document.title=data.progress;return}const report=data.report;output.textContent=JSON.stringify({...report,cases:report.cases.map(({result,...c})=>({...c,accepted:result.candidate_hypotheses.some(h=>h.accepted),decision:result.decision}))},null,2);pending=pending.then(async()=>{const response=await fetch('/__test__/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});if(!response.ok)throw Error('Report export failed')});if(data.done){worker.terminate();pending.then(()=>document.title='Targeted recovery '+report.phase).catch(error=>output.textContent=String(error))}};worker.postMessage({fixture:new URLSearchParams(location.search).get('fixture')});
</script>
