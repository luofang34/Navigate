<!doctype html><meta charset="utf-8"><title>Check refined scene map alignment</title><style>body{background:#090e15;color:#dce7f7;font:18px system-ui;margin:32px}pre{white-space:pre-wrap}button{font:inherit}</style><h1>Check refined scene map alignment</h1><button id="start">Check refined scene anchors</button><button id="response">Check response</button><pre>Ready</pre><script type="module">
import * as storage from './storage.js';import {BrowserPipeline} from './browser-pipeline.js';import {gray} from './observation.js';import {matchingOptions} from './matching-options.js';import {sceneMapPlans} from './scene-map.js';
const requested=new URLSearchParams(location.search).get('scene'),prefix=['dense','anchored-dense'].includes(requested)?requested:'wide';
const sink='http://127.0.0.1:61678/',output=document.querySelector('pre');let clicks=0;document.querySelector('#response').onclick=e=>e.target.textContent='Response '+(++clicks);
document.querySelector('#start').onclick=async e=>{e.target.disabled=true;const pipeline=new BrowserPipeline(),start=performance.now(),progress=t=>output.textContent=t;try{
 const mission=await storage.get('missions','aee48b20e6714aefb3436720ec149a93');if(!mission)throw Error('Source mission absent');const pack=await storage.get('packs',mission.pack_id);
 const wide=await(await fetch(sink+prefix+'-scene-graph.json')).json(),refinement=await(await fetch(sink+prefix+'-scene-refinement.json')).json();
 if(JSON.stringify(wide.camera)!==JSON.stringify(mission.view.camera))throw Error('Camera calibration changed');
 const byId=new Map(mission.view.frames.map(f=>[f.observation_sha256,f]));for(const o of wide.observations){const frame=byId.get(o.observation_sha256);if(!frame||frame.capture_time_ns!==o.capture_time_ns)throw Error('Source observation changed')}
 const group=await storage.saveImageTracks(JSON.stringify({...wide,stage:'image_associations'}));
 const record=await storage.saveSceneReconstruction(JSON.stringify({stage:'local_scene_reconstruction',method:'conditional_joint_refinement',geographic_acceptance:false,source_group_sha256:group.sha256,source_scene_path_sha256:refinement.source_scene_path_sha256,scene:refinement.result.scene,initial_cost:refinement.result.initial_cost,final_cost:refinement.result.final_cost,evidence_correlation:'unknown; shared source images and estimated scene; no confidence accumulation'}));
 const root={record,local_solution:record,coordinate_frame:record.sha256,parent_scene_sha256:null,cameras:refinement.result.scene.cameras},schedule=sceneMapPlans({groups:[{candidates:[root]}]},mission.view.frames,{maxPaths:1}),results=[];
 await pipeline.initialize(pack,wide.camera,progress,matchingOptions('balanced'));
 for(const plan of schedule.plans){const frame=plan.anchor.frame,bitmap=await createImageBitmap(await storage.queryBlob(mission,frame));let image;try{image=gray(bitmap,wide.camera.width,wide.camera.height)}finally{bitmap.close()};results.push(await pipeline.registerScene({...plan,preview_path_budget:8},image,mission.view.prior,progress))}
 const report={stage:prefix+'_scene_map_registration',scene_points:refinement.result.scene.points.length,mission_id:mission.id,record,group,anchors:schedule.plans.map(p=>({time_s:p.anchor.frame.capture_time_ns/1e9,observation_sha256:p.anchor.frame.observation_sha256})),results,elapsed_ms:performance.now()-start,clicks,geographic_acceptance:false};
 await fetch(sink+'result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});output.textContent=JSON.stringify({...report,results:results.map(r=>({attempts:r.attempts,candidates:r.registrations.reduce((n,x)=>n+x.candidates.length,0)}))},null,2);document.title='Complete refined map alignment';
}catch(error){output.textContent=String(error)+'\n'+error.stack;document.title='FAIL refined map alignment'}finally{pipeline.close();e.target.disabled=false}};
</script>
