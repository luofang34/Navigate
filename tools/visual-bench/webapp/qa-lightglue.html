<!doctype html><meta charset="utf-8"><title>Local LightGlue browser comparison</title><pre>Starting local research comparison</pre><script type="module">
const worker=new Worker('./qa-lightglue-worker.js',{type:'module'});worker.onmessage=async({data})=>{if(data.progress)document.title=data.progress;if(data.report){document.querySelector('pre').textContent=JSON.stringify(data.report,null,2);await fetch('/__test__/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data.report)})}if(data.done){document.title=data.report.error?'FAIL local LightGlue comparison':'Completed local LightGlue comparison';worker.terminate()}};worker.onerror=event=>{document.title='FAIL local comparison worker';document.querySelector('pre').textContent=event.message};worker.postMessage({model:new URLSearchParams(location.search).get('model')});
</script>
