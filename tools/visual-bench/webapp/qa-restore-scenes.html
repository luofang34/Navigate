<!doctype html><meta charset="utf-8"><title>Restore verified scene assets</title><style>body{background:#090e15;color:#dce7f7;font:18px system-ui;margin:32px}pre{white-space:pre-wrap}button{font:inherit}</style><h1>Restore verified scene assets</h1><button>Restore exact scene data</button><pre>Ready</pre><script type="module">
import * as storage from './storage.js';const output=document.querySelector('pre'),sink='http://127.0.0.1:61678/';document.querySelector('button').onclick=async e=>{e.target.disabled=true;try{const mission=await storage.get('missions','aee48b20e6714aefb3436720ec149a93');if(!mission)throw Error('Source mission absent');if(!await storage.requestPersistence())throw Error('Persistent storage required');const response=await fetch(sink+'recovered-scene-assets-manifest.json');if(!response.ok)throw Error('Recovery manifest absent');const manifest=await response.json(),before=JSON.stringify(mission.view.frames);await storage.downloadFiles(manifest.files,(n,t)=>output.textContent=`Restoring and verifying ${Math.round(100*n/t)}%…`);mission.view.restoration={...mission.view.restoration,derived_scene_assets:'all source groups and scene solutions restored with exact checksums',verified_asset_count:manifest.files.length,geographic_acceptance:false};await storage.put('missions',mission.id,mission);if(before!==JSON.stringify((await storage.get('missions',mission.id)).view.frames))throw Error('Camera estimates changed');const receipt={stage:'restored_exact_scene_assets',mission_id:mission.id,assets:manifest.files.length,unchanged_camera_estimates:true,geographic_acceptance:false};await fetch(sink+'result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(receipt)});output.textContent=JSON.stringify(receipt,null,2);document.title='Complete scene asset restoration'}catch(error){output.textContent=String(error);document.title='FAIL scene asset restoration'}finally{e.target.disabled=false}};
</script>
