<!doctype html><meta charset="utf-8"><title>Automatic scene sampling check</title><style>body{background:#090e15;color:#dce7f7;font:18px system-ui;margin:32px}pre{white-space:pre-wrap}button{font:inherit}</style><h1>Automatic scene sampling check</h1><p>Select the original video to check automatic refinement of the saved scene break. No geographic accuracy is assumed.</p><input type="file" accept="video/*" aria-label="Original flight video"><button id="response">Check response</button><pre>Ready</pre><script type="module">
import * as storage from './storage.js';import {BrowserPipeline} from './browser-pipeline.js';import {openInput,frameAt,gray} from './observation.js';import {checkSavedVideo} from './saved-video.js';import {matchingOptions} from './matching-options.js';import {refineSceneSampling} from './scene-sampling.js';import {sceneMapPlans,appendScenePaths} from './scene-map.js';
const output=document.querySelector('pre'),origin='http://127.0.0.1:61678/',progress=text=>output.textContent=text;let clicks=0;document.querySelector('button').onclick=e=>e.target.textContent='Response '+(++clicks);
document.querySelector('input').onchange=async e=>{const pipeline=new BrowserPipeline();let media,done=false,ticks=0,last,maxGap=0;const tick=t=>{if(last)maxGap=Math.max(maxGap,t-last);last=t;ticks++;if(!done)requestAnimationFrame(tick)};requestAnimationFrame(tick);const started=performance.now();
try{
 const mission=await storage.get('missions','b1333953386146fe958f824bc9a0ad8f');if(!mission)throw Error('Verified review mission is absent');const camera=mission.view.camera,pack=await storage.get('packs',mission.pack_id),frames=mission.view.frames;
 const savedPixels=async f=>{const bitmap=await createImageBitmap(await storage.queryBlob(mission,f));try{return {...gray(bitmap,camera.width,camera.height),time:f.capture_time_ns/1e9,requested_time_s:f.requested_time_s,timing:f.timing_scope}}finally{bitmap.close()}};
 media=await openInput(e.target.files[0],document.createElement('video'));await checkSavedVideo(mission,{decode:t=>frameAt(media,t,camera),savedPixels:async f=>(await savedPixels(f)).gray});
 const parents=await(await fetch(origin+'refinement-parents.json')).json();if(parents.missing?.length)throw Error('Refinement parent export is incomplete');for(const {record,value} of parents.scenes){const stored=await storage.saveSceneReconstruction(JSON.stringify(value));if(stored.sha256!==record.sha256||stored.size!==record.size)throw Error('Imported scene identity changed')}
 const replay=await(await fetch(origin+'point-flight-replay-restored.json')).json();
 await pipeline.initialize(pack,camera,progress,matchingOptions('balanced'));mission.view.processing={stage:'automatic scene sampling',complete:false};await storage.put('missions',mission.id,mission);
 const result=await refineSceneSampling(replay.result,{pipeline,frames,prior:mission.view.prior,image:savedPixels,decode:t=>frameAt(media,t,camera),save:samples=>storage.saveMissionSamples(mission,samples),commit:()=>storage.put('missions',mission.id,mission),progress});
 mission.view.local_reconstruction=result;mission.view.processing.stage='refined scene registration';await storage.put('missions',mission.id,mission);
 const schedule=sceneMapPlans(result,frames,{maxPaths:2}),results=[];let budget=32;
 for(const [i,plan] of schedule.plans.entries()){const image=await savedPixels(plan.anchor.frame),registered=await pipeline.registerScene({...plan,preview_path_budget:Math.ceil(budget/(schedule.plans.length-i))},image,mission.view.prior,progress);budget-=registered.preview_paths;results.push(registered)}
 for(const f of frames)f.candidate_hypotheses=f.candidate_hypotheses.filter(h=>!h.scene_supported);const added=appendScenePaths(frames,results.flatMap(r=>r.registrations));
 mission.view.scene_registration={stage:schedule.stage,geographic_acceptance:false,results};mission.view.processing={stage:'missing original observations and unmeasured accuracy',complete:false};await storage.put('missions',mission.id,mission);
 const report={stage:'automatic_scene_sampling',elapsed_ms:performance.now()-started,mission_id:mission.id,frames:frames.length,added_scene_pose_alternatives:added,reconstruction:result,results,ui:{ticks,maxGap,clicks},geographic_acceptance:false};await fetch(origin+'result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});
 const paths=results.flatMap(r=>r.registrations.flatMap(r=>r.candidates.flatMap(c=>c.paths)));output.textContent=JSON.stringify({stage:report.stage,elapsed_ms:report.elapsed_ms,frames:frames.length,sampling:result.sampling_refinement,paths:paths.map(p=>({cameras:p.cameras.length,final:Math.max(...p.cameras.map(c=>frames.find(f=>f.observation_sha256===c.observation_sha256).capture_time_ns/1e9))})),execution:frames.filter(f=>f.reason==='Extra scene sample; geographic search was not run.').at(-1)?.execution,ui:report.ui},null,2);document.title='Complete automatic scene sampling';
}catch(error){output.textContent=String(error)+'\n'+error.stack;document.title='FAIL automatic scene sampling'}finally{done=true;media?.close();pipeline.close()}};
</script>
