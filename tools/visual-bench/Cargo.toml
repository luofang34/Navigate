[package]
name = "visual-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
navigate-visual = { path = "../../crates/navigate-visual", features = ["gpu"] }
clap = { version = "4", features = ["derive"] }
maplibre = { path = "../../../maplibre-rs-experimental/maplibre", features = ["headless", "thread-safe-futures"] }
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
thiserror = { version = "2.0.18", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.10"
cgmath = "0.18"
wgpu = "22.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
