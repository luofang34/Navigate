[package]
name = "visual-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
navigate-data = { path = "../../crates/navigate-data" }
navigate-data-fs = { path = "../../crates/navigate-data-fs" }
navigate-imagery = { path = "../../crates/navigate-imagery" }
navigate-visual = { path = "../../crates/navigate-visual", features = ["gpu"] }
clap = { version = "4", features = ["derive"] }
maplibre = { path = "../../../maplibre-rs-experimental/maplibre", features = ["headless", "thread-safe-futures"] }
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
thiserror = { version = "2.0.18", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.10"
cgmath = "0.18"
wgpu = "30.0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
await_holding_lock = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
