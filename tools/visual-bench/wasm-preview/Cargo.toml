[package]
name = "navigate-visual-preview"
version = "0.1.0"
edition = "2024"
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
navigate-visual = { path = "../../../crates/navigate-visual", features = ["reconstruction"] }
navigate-data = { path = "../../../crates/navigate-data" }
navigate-imagery = { path = "../../../crates/navigate-imagery" }
maplibre = { path = "../../../../maplibre-rs-experimental/maplibre", features = ["headless"] }
wgpu = "30.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
sha2 = "0.10"
cgmath = "0.18"
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance", "console", "HtmlCanvasElement"] }
[profile.release]
opt-level = 2
[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
await_holding_lock = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
