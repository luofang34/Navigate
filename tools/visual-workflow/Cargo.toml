[package]
name = "navigate-workflow"
description = "Native feature package and visual localization workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
gpu = ["navigate-visual/gpu"]
rustnn-coreml = ["navigate-visual-onnx/rustnn-coreml"]

[dependencies]
navigate-visual = { path = "../../crates/navigate-visual" }
navigate-visual-workflow = { path = "../../crates/navigate-visual-workflow" }
navigate-visual-render = { path = "../../crates/navigate-visual-render" }
pollster = "0.3"
npyz = "0.8.4"
navigate-recording = { path = "../../crates/navigate-recording" }
navigate-visual-onnx = { package = "visual-inference-probe", path = "../visual-inference" }
image = { workspace = true, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
clap = "4"
nalgebra.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
