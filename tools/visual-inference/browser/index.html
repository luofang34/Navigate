<!doctype html><meta charset="utf-8"><title>Local matcher validation</title><style>body{background:#080e15;color:#d9e2ef;font:16px system-ui;padding:30px}pre{white-space:pre-wrap}</style><h1>Local matcher validation</h1><pre>Starting worker…</pre><script type="module">const worker=new Worker('./worker.js',{type:'module'});worker.onmessage=({data})=>{document.querySelector('pre').textContent=JSON.stringify(data,null,2);if(data.complete)document.title=data.error?'FAIL matcher validation':'PASS matcher validation'};worker.onerror=e=>document.querySelector('pre').textContent=e.message;</script>
