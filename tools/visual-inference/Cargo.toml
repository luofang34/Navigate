[package]
name = "visual-inference-probe"
version = "0.1.0"
edition = "2024"
[lib]
name = "navigate_visual_onnx"

[workspace]
[dependencies]
navigate-visual = { path = "../../crates/navigate-visual" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
nalgebra = "0.34.1"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "coreml"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
