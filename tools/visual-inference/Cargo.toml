[package]
name = "visual-inference-probe"
version = "0.1.0"
edition = "2024"
[lib]
name = "navigate_visual_onnx"

[workspace]

[features]
rustnn-coreml = ["dep:rustnn", "rustnn/coreml-runtime"]

[dependencies]
navigate-visual-workflow = { path = "../../crates/navigate-visual-workflow" }
navigate-visual = { path = "../../crates/navigate-visual" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
nalgebra = "0.34.1"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-22", "load-dynamic", "coreml", "cuda", "tensorrt"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
rustnn = { git = "https://github.com/rustnn/rustnn", rev = "7a273752263989a4bdcb4cf48e999575e2a59842", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "forbid"
let_underscore_future = "forbid"
await_holding_lock = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
