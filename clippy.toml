disallowed-types = [
    { path = "anyhow::Error", reason = "typed errors only in this workspace; use thiserror enums" },
]

disallowed-macros = [
    { path = "std::println", reason = "use tracing; CLI product output goes through an explicitly allowed output module" },
    { path = "std::print", reason = "use tracing; CLI product output goes through an explicitly allowed output module" },
    { path = "std::eprintln", reason = "use tracing for diagnostics" },
    { path = "std::eprint", reason = "use tracing for diagnostics" },
    { path = "std::dbg", reason = "use tracing for diagnostics" },
]

# Clippy configuration. See https://doc.rust-lang.org/clippy/lint_configuration.html
#
# Test code uses `.unwrap()`, `.expect()`, `panic!`, `assert!`, indexing,
# `println!`/`dbg!`, and other "if this fails, the test fails" idioms by
# convention. We keep the corresponding restriction lints active in production
# code but exempt tests.
allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
